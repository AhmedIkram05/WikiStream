name: Terraform Plan

# PR-time plan only. The reviewer-facing artifact is the plan comment posted
# by the github-script step; apply stays in apply.yml behind the production
# environment gate (ADR-008).
on:
  pull_request:

# Fork note: fork PRs get no OIDC token (public repo — expected), so plan
# would fail auth there even with a live GCP identity; accepted, documented
# in ADR-008.
permissions:
  id-token: write # WIF exchange for the deploy SA
  contents: read # checkout
  pull-requests: write # post the plan comment

jobs:
  # No GCP dependency: fmt/validate never touch the backend or any Google
  # API, so this runs for every PR, dependabot included. Only the plan job
  # below needs the WIF exchange.
  tf-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.15.6 # match local dev (1.15.6); do not float

      - name: Format check
        working-directory: infra/main
        run: terraform fmt -check

      # -backend=false: validate does not read state, so no GCS access.
      # -input=false: never let CI hang on an interactive prompt.
      - name: Init (no backend)
        working-directory: infra/main
        run: terraform init -input=false -backend=false

      - name: Validate
        working-directory: infra/main
        run: terraform validate

  # Master switch: repo variable GCP_DEPLOY_ENABLED. The deploy SA / WIF pool
  # (infra/bootstrap) is disabled, so the WIF exchange fails with
  # invalid_target and used to turn every human PR red. Unset variable = job
  # skipped, not failed. Restore the pool, set the variable to 'true', and
  # plan comments come back. Dependabot PRs keep their skip: dep bumps touch
  # no terraform, so a plan run would be signal-free runner spend.
  plan:
    if: vars.GCP_DEPLOY_ENABLED == 'true' && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # terraform.tfvars is gitignored (hygiene: personal values never in the
    # repo — only .example is tracked). CI gets its variables via TF_VAR_*
    # envs from GitHub Actions secrets; Terraform reads TF_VAR_<name>
    # automatically. allowed_ips is a list, so the secret holds JSON.
    env:
      TF_VAR_project_id: ${{ secrets.TF_VAR_PROJECT_ID }}
      TF_VAR_region: ${{ secrets.TF_VAR_REGION }}
      TF_VAR_zone: ${{ secrets.TF_VAR_ZONE }}
      TF_VAR_alert_email: ${{ secrets.TF_VAR_ALERT_EMAIL }}
      TF_VAR_allowed_ips: ${{ secrets.TF_VAR_ALLOWED_IPS }}
      TF_VAR_oslogin_human_member: ${{ secrets.TF_VAR_OSLOGIN_HUMAN_MEMBER }}
    steps:
      - uses: actions/checkout@v7

      # WIF: no stored key on the runner; identity comes from the OIDC token
      # issued for this run. Version pinned at build 2026-08-11.
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/984854414993/locations/global/workloadIdentityPools/wikistream-ci/providers/github
          service_account: wikistream-deploy@wikistream-505003.iam.gserviceaccount.com

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.15.6 # match local dev (1.15.6); do not float

      - name: Format check
        working-directory: infra/main
        run: terraform fmt -check

      # Backend bucket already exists from bootstrap, so plain init works.
      # -input=false: never let CI hang on an interactive prompt.
      - name: Init
        working-directory: infra/main
        run: terraform init -input=false

      - name: Validate
        working-directory: infra/main
        run: terraform validate

      # Plan output goes to a file in $RUNNER_TEMP, not a step-output heredoc:
      # multi-KB plans are unreliable through $GITHUB_OUTPUT. tfplan is binary,
      # so `show` renders it for the comment. temp path keeps the checkout
      # pristine.
      - name: Plan
        working-directory: infra/main
        run: |
          terraform plan -input=false -out=tfplan
          terraform show -no-color tfplan > "$RUNNER_TEMP/plan.txt"

      # File path passed via env so the script never guesses where the file
      # lives. The fenced block makes the plan readable in the PR thread.
      - name: Comment plan on PR
        uses: actions/github-script@v9
        env:
          PLAN_FILE: ${{ runner.temp }}/plan.txt
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync(process.env.PLAN_FILE, 'utf8');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: 'Terraform plan (infra/main):\n\n```hcl\n' + plan + '\n```',
            });
