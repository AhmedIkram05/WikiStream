# Dependabot — unified Monday-morning dependency updates.
# Weekly, Monday 09:00 Europe/London. Minor/patch bumps are grouped into one
# PR per ecosystem; majors stay individual PRs for review.
version: 2
updates:
  # Python deps (consumer/pyproject.toml + uv.lock). The dedicated `uv`
  # ecosystem (GA 2025-03) is first-class for uv projects: it updates the
  # manifest and lockfile together, so `uv sync --frozen` in CI and the
  # Dockerfile keep working unchanged.
  - package-ecosystem: uv
    directory: /consumer
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Europe/London
    target-branch: main
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - python
    commit-message:
      prefix: "chore"
    groups:
      minor-patch:
        update-types: ["minor", "patch"]

  # GitHub Actions: action version bumps + workflow linting.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Europe/London
    target-branch: main
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - ci
    commit-message:
      prefix: "chore"
    groups:
      minor-patch:
        update-types: ["minor", "patch"]

  # Container base image (consumer/Dockerfile).
  - package-ecosystem: docker
    directory: /consumer
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Europe/London
    target-branch: main
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - docker
    commit-message:
      prefix: "chore"
    groups:
      docker-all:
        patterns: ["*"]

  # Container base image (gx/Dockerfile).
  - package-ecosystem: docker
    directory: /gx
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Europe/London
    target-branch: main
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - docker
    commit-message:
      prefix: "chore"
    ignore:
      # gx pins CPython 3.12 (requires-python ">=3.12,<3.13"; GX 0.18.x needs
      # pandas<2.2 / numpy<2.0, which have no cp313+ wheels). Ignore the python
      # base-image major so the unsupported 3.14 bump is not re-proposed — the
      # image must stay on python:3.12-slim (see gx/Dockerfile).
      - dependency-name: "python"
        versions: [">= 3.13"]
    groups:
      docker-all:
        patterns: ["*"]

  # Terraform providers. infra/main and infra/bootstrap are separate
  # directories and Dependabot's terraform ecosystem does NOT recurse, so each
  # module needs its own entry — a bare `/infra` finds no .tf files and the
  # updater errors with "No files found in /infra".
  - package-ecosystem: terraform
    directory: /infra/main
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Europe/London
    target-branch: main
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - terraform
    commit-message:
      prefix: "chore"
    groups:
      minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: terraform
    directory: /infra/bootstrap
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Europe/London
    target-branch: main
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - terraform
    commit-message:
      prefix: "chore"
    groups:
      minor-patch:
        update-types: ["minor", "patch"]
