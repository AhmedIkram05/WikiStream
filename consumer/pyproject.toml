[project]
name = "wikistream-consumer"
version = "0.1.0"
description = "Wikimedia recentchange SSE -> ClickHouse consumer"
requires-python = ">=3.13"
dependencies = [
    "clickhouse-connect[async]==1.7.2",
    "httpx2==2.10.0",
    "pydantic>=2,<3",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
]

# Ruff config (consumed by CI `ruff check .`, pre-commit ruff hook, and local
# `ruff` alike — one source of truth; ruff discovers this file for consumer/).
# BLE001: the consumer's Phase 1 resilience contract is never-crash — the
# broad catches in consumer.py (insert-failed, consume-loop, cold-start
# retry) are deliberate: log the failure, keep the stream alive. Narrowing
# them would change behavior, not improve it. SIM102 was fixed in code.
[tool.ruff.lint]
# select pinned for the same reason as ruff.toml: FLY joined defaults in
# 0.16.x, so an unselected config would silently drop it on older ruff.
select = ["E", "F", "FLY"]
ignore = ["BLE001"]
