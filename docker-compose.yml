services:
  clickhouse:
    image: clickhouse/clickhouse-server:26.3.17
    container_name: wikistream-clickhouse
    restart: unless-stopped
    environment:
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports:
      - "8123:8123"   # HTTP — Grafana datasource + consumer + ad-hoc verification queries
      - "9000:9000"   # native — clickhouse-client only; the consumer never uses it
    volumes:
      # Phase 3A: CH_DATA_DIR is set on the VM (startup.sh mounts the durable
      # ch-data disk at /mnt/ch-data/clickhouse); unset locally falls back to
      # the named `ch-data` volume declared below.
      - ${CH_DATA_DIR:-ch-data}:/var/lib/clickhouse
    ulimits:
      nofile: { soft: 262144, hard: 262144 }

  consumer:
    build: ./consumer
    image: ${CONSUMER_IMAGE:-wikistream-consumer:local}
    container_name: wikistream-consumer
    restart: unless-stopped
    depends_on: [clickhouse]
    environment:
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: "8123"
      CLICKHOUSE_USER: wikistream
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-wikistream_dev_password}
      STREAM_URL: https://stream.wikimedia.org/v2/stream/recentchange

  grafana:
    image: grafana/grafana:13.1.1
    container_name: wikistream-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_PLUGINS_PREINSTALL: grafana-clickhouse-datasource@4.20.0,grafana-bigquery-datasource@3.2.0
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:-admin}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-wikistream_dev_password}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro

volumes:
  ch-data:
