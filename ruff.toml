# Repo-wide ruff defaults for CI (bare `ruff check .` / `ruff format --check .`
# from repo root), the pre-commit ruff hooks, and local runs — one discovery
# point for every file OUTSIDE consumer/ (consumer/ carries its own settings
# in consumer/pyproject.toml).
# docs/ holds locked planning artifacts: ruff-format rewrites python fenced
# code blocks inside markdown, so it must never touch them.
extend-exclude = ["docs"]

[tool.ruff.lint]
# Pin the rule set explicitly: FLY only joined ruff's DEFAULTS in 0.16.x, so a
# select-less config silently dropped it on older binaries — the 3B FLY002
# slipped past a 0.15.15 local `ruff` while CI/pre-commit (0.16.2) caught it.
# With select explicit, every ruff >= the version supporting these codes behaves
# identically in the shell, in pre-commit, and in CI regardless of defaults.
select = ["E", "F", "FLY"]
