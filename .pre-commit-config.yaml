# Phase 1 quality gate. Mirrors what CI runs in .github/workflows/ci.yml.
# Ruff config lives in consumer/pyproject.toml ([tool.ruff.lint]) — the one
# source of truth for CI, this hook, and local `ruff` (version pinned to
# 0.16.2 in BOTH ci.yml and the ruff-pre-commit rev below). Default rule set
# (F + E4/E7/E9) + ruff-format; widen later if Phase 4+ needs it.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.2
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
