[pytest]
testpaths = tests
pythonpath = consumer gx
markers =
    ch: requires ClickHouse (runs against localhost:8123)
filterwarnings =
    # runpy re-executes a module in a fresh namespace; the stubbed asyncio.run
    # discards the fresh main() coroutine and the re-import trips runpy's
    # own guard — both benign (test_*_main_guard).
    ignore:coroutine '\w+' was never awaited:RuntimeWarning
    ignore:'src\..*' found in sys.modules after import of package 'src':RuntimeWarning
